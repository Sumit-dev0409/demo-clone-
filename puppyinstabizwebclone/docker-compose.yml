services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teddypups
      POSTGRES_USER: teddypups
      POSTGRES_PASSWORD: teddypups
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teddypups -d teddypups"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://teddypups:teddypups@db:5432/teddypups
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && node server.js"]
    ports:
      - "3000:3000"

volumes:
  postgres-data:
